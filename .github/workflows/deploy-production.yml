name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Next.js App
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30

    steps:
      - name: Deploy Next.js app to server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail

            echo "🚀 [1/5] Setting up environment..."
            export PATH="$HOME/.bun/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

            if ! command -v bun &> /dev/null; then
              echo "⚠️ Bun not found on server. Installing Bun..."
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
            fi

            if ! command -v pm2 &> /dev/null; then
              echo "⚠️ PM2 not found on server. Installing PM2..."
              bun install -g pm2
            fi

            echo "📌 Using Bun version: $(bun --version)"
            pm2_bin="$(command -v pm2)"
            echo "📌 Using PM2 version: $(bun "$pm2_bin" --version)"

            echo "📂 [2/5] Updating source code..."
            cd "${{ secrets.REMOTE_PATH }}"
            git fetch origin main --prune
            git reset --hard origin/main

            echo "🔒 [3/5] Checking lockfile & installing dependencies..."
            bun install --frozen-lockfile

            echo "🏗️ [4/5] Building Next.js app..."
            NODE_OPTIONS="--max-old-space-size=2048" bun run build

            echo "🔄 [5/5] Reloading PM2..."
            set -a
            . ./.env
            set +a
            bun "$pm2_bin" startOrReload ecosystem.config.cjs --update-env
            bun "$pm2_bin" save

            echo "✅ Deployment successful"
